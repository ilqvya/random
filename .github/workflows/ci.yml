name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} - C++${{ matrix.std }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        std: [11, 14, 17, 20, 23, 26]
        compiler: [gcc]
        include:
          - os: ubuntu-latest
            compiler: clang
            std: 11
          - os: ubuntu-latest
            compiler: clang
            std: 14
          - os: ubuntu-latest
            compiler: clang
            std: 17
          - os: ubuntu-latest
            compiler: clang
            std: 20
          - os: ubuntu-latest
            compiler: clang
            std: 23
          - os: ubuntu-latest
            compiler: clang
            std: 26
          - os: macos-latest
            compiler: appleclang
            std: 11
          - os: macos-latest
            compiler: appleclang
            std: 14
          - os: macos-latest
            compiler: appleclang
            std: 17
          - os: macos-latest
            compiler: appleclang
            std: 20
          - os: macos-latest
            compiler: appleclang
            std: 23
          - os: macos-latest
            compiler: appleclang
            std: 26
          - os: windows-latest
            compiler: msvc
            std: 11
          - os: windows-latest
            compiler: msvc
            std: 14
          - os: windows-latest
            compiler: msvc
            std: 17
          - os: windows-latest
            compiler: msvc
            std: 20
          - os: windows-latest
            compiler: msvc
            std: 23
          - os: windows-latest
            compiler: msvc
            std: 26
        exclude:
          - os: macos-latest
            compiler: gcc
          - os: windows-latest
            compiler: gcc

    steps:
      - uses: actions/checkout@v4

      - name: Set up Clang on Linux
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'clang'
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Configure CMake
        run: >
          cmake -B build
          -DRandom_BuildTests=ON
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          python3 -m pip install --upgrade pip gcovr

      - name: Configure CMake
        run: >
          cmake -B build
          -DRandom_BuildTests=ON
          -DCOVERAGE_ENABLED=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Generate Coverage Report
        run: |
          lcov --capture --directory build --output-file coverage.raw --ignore-errors mismatch,unused,inconsistent 2>/dev/null || lcov --capture --directory build --output-file coverage.raw || true
          if [ -f coverage.raw ]; then
            # Strip all system headers (/usr/*), test files, and build files
            lcov --remove coverage.raw '/usr/*' '*/test/*' '*/tests/*' '*/build/*' --output-file coverage.info --ignore-errors mismatch,unused,inconsistent 2>/dev/null || lcov --remove coverage.raw '/usr/*' '*/test/*' '*/tests/*' '*/build/*' --output-file coverage.info || true
            # Ensure no /usr/* files remain
            lcov --remove coverage.info '/usr/*' --output-file coverage.info --ignore-errors mismatch,unused,inconsistent 2>/dev/null || true
          fi
          if [ ! -s coverage.info ]; then
            echo "Generating coverage with gcovr..."
            gcovr -r . --filter '^include/' --exclude-directories '/usr' --exclude-directories 'test' --lcov coverage.info --print-summary
          else
            lcov --list coverage.info --ignore-errors mismatch,unused,inconsistent 2>/dev/null || lcov --list coverage.info
          fi

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          file: coverage.info
          format: lcov

  coverity:
    name: Coverity Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B build
          -DRandom_BuildTests=ON
          -DCMAKE_CXX_STANDARD=17
          -DCMAKE_BUILD_TYPE=Debug

      - name: Cache Coverity Build Tool
        uses: actions/cache@v4
        id: cache-coverity
        with:
          path: cov-analysis
          key: coverity-analysis-linux64-v1

      - name: Download Coverity Build Tool
        if: steps.cache-coverity.outputs.cache-hit != 'true'
        env:
          COVERITY_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        run: |
          if [ -z "$COVERITY_TOKEN" ]; then
            echo "COVERITY_SCAN_TOKEN secret is not set!"
            exit 0
          fi
          echo "Downloading Coverity Scan analysis tool..."
          curl -s -L --form project=ilqvya-random --form token="${COVERITY_TOKEN}" https://scan.coverity.com/download/linux64 -o coverity_tool.tar.gz || true
          if ! file coverity_tool.tar.gz | grep -q "gzip"; then
            echo "Retrying download with project=ilqvya/random..."
            curl -s -L --form project=ilqvya/random --form token="${COVERITY_TOKEN}" https://scan.coverity.com/download/linux64 -o coverity_tool.tar.gz || true
          fi
          if file coverity_tool.tar.gz | grep -q "gzip"; then
            mkdir -p cov-analysis
            tar -xzf coverity_tool.tar.gz -C cov-analysis --strip-components=1
            rm -f coverity_tool.tar.gz
          else
            echo "Server response from Coverity download:"
            head -n 20 coverity_tool.tar.gz || true
            rm -f coverity_tool.tar.gz
          fi

      - name: Build with cov-build
        env:
          COVERITY_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        run: |
          if [ ! -d cov-analysis/bin ]; then
            echo "Skipping cov-build: Coverity tool not installed."
            exit 0
          fi
          "$GITHUB_WORKSPACE/cov-analysis/bin/cov-build" --dir cov-int cmake --build build

      - name: Submit to Coverity Scan
        env:
          COVERITY_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
          COVERITY_EMAIL: ${{ secrets.COVERITY_SCAN_EMAIL || 'ilqvya@icloud.com' }}
        run: |
          if [ -z "$COVERITY_TOKEN" ] || [ ! -d cov-int ]; then
            echo "Skipping: No coverity build output or token available."
            exit 0
          fi
          tar czf cov-int.tar.gz cov-int
          RESPONSE=$(curl --silent --show-error \
            --form token="${COVERITY_TOKEN}" \
            --form email="${COVERITY_EMAIL}" \
            --form file=@cov-int.tar.gz \
            --form version="${GITHUB_SHA:0:7}" \
            --form description="GitHub Actions build (${GITHUB_REF_NAME})" \
            https://scan.coverity.com/builds?project=ilqvya-random)
          echo "Coverity Scan response: $RESPONSE"



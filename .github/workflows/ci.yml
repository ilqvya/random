name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} - C++${{ matrix.std }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        std: [11, 14, 17, 20, 23, 26]
        compiler: [gcc]
        include:
          - os: ubuntu-latest
            compiler: clang
            std: 11
          - os: ubuntu-latest
            compiler: clang
            std: 14
          - os: ubuntu-latest
            compiler: clang
            std: 17
          - os: ubuntu-latest
            compiler: clang
            std: 20
          - os: ubuntu-latest
            compiler: clang
            std: 23
          - os: ubuntu-latest
            compiler: clang
            std: 26
          - os: macos-latest
            compiler: appleclang
            std: 11
          - os: macos-latest
            compiler: appleclang
            std: 14
          - os: macos-latest
            compiler: appleclang
            std: 17
          - os: macos-latest
            compiler: appleclang
            std: 20
          - os: macos-latest
            compiler: appleclang
            std: 23
          - os: macos-latest
            compiler: appleclang
            std: 26
          - os: windows-latest
            compiler: msvc
            std: 11
          - os: windows-latest
            compiler: msvc
            std: 14
          - os: windows-latest
            compiler: msvc
            std: 17
          - os: windows-latest
            compiler: msvc
            std: 20
          - os: windows-latest
            compiler: msvc
            std: 23
          - os: windows-latest
            compiler: msvc
            std: 26
        exclude:
          - os: macos-latest
            compiler: gcc
          - os: windows-latest
            compiler: gcc

    steps:
      - uses: actions/checkout@v4

      - name: Set up Clang on Linux
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'clang'
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Configure CMake
        run: >
          cmake -B build
          -DRandom_BuildTests=ON
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          python3 -m pip install --upgrade pip gcovr

      - name: Configure CMake
        run: >
          cmake -B build
          -DRandom_BuildTests=ON
          -DCOVERAGE_ENABLED=ON
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Generate Coverage Report
        run: |
          lcov --capture --directory build --output-file coverage.raw --ignore-errors mismatch,unused,inconsistent 2>/dev/null || lcov --capture --directory build --output-file coverage.raw || true
          if [ -f coverage.raw ]; then
            lcov --extract coverage.raw '*/include/*' --output-file coverage.info --ignore-errors mismatch,unused,inconsistent 2>/dev/null || lcov --extract coverage.raw '*/include/*' --output-file coverage.info || true
          fi
          if [ ! -s coverage.info ]; then
            echo "Generating coverage with gcovr..."
            gcovr -r . --filter 'include/' --lcov coverage.info --print-summary
          else
            lcov --list coverage.info --ignore-errors mismatch,unused,inconsistent 2>/dev/null || lcov --list coverage.info
          fi

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        with:
          github-token: ${{ secrets.COVERALLS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          file: coverage.info
          format: lcov


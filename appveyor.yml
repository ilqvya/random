version: '{build}'

image:
  - Ubuntu
  - Ubuntu1804
  - Ubuntu2004
  - Ubuntu2204
  - Ubuntu2404
  - macos-sonoma
  - macos-ventura
  - macos-monterey
  - Visual Studio 2015
  - Visual Studio 2017
  - Visual Studio 2019
  - Visual Studio 2022

platform:
  - x64
  - x86

configuration:
  - Release
  - Debug

build: off

for:
  - matrix:
      only:
        - image: Ubuntu
        - image: Ubuntu1804
        - image: Ubuntu2004
        - image: Ubuntu2204
        - image: Ubuntu2404
        - image: macos-sonoma
        - image: macos-ventura
        - image: macos-monterey
    build_script:
      - sh: ./appveyor_build_lin.sh

  - matrix:
      only:
        - image: Visual Studio 2015
        - image: Visual Studio 2017
        - image: Visual Studio 2019
        - image: Visual Studio 2022
    build_script:
      - cmd: .\appveyor_build_win.bat
